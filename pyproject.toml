[project]
name = "jarvis"
version = "0.0.0"
description = "JARVIS 2.0 - persistent cognitive operating system (M1 kernel baseline)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.5,<3",
    "cryptography>=42,<46",
    "httpx>=0.27,<1",
    "anyio>=4.0,<5",
    "opentelemetry-api>=1.20,<2",
    "opentelemetry-sdk>=1.20,<2",
    "psutil>=5.9,<8",
    "openai>=1.40",
]

[dependency-groups]
# Red-team finding F8: pytest was never declared, so `uv run pytest` could
# silently resolve a system PATH pytest under an interpreter below the
# ADR-008 pin floor. Declaring it pins the suite to the project venv.
dev = [
    "pytest>=9,<10",
    "pyyaml>=6.0,<7",  # creator-ruled 2026-09-19: tests/test_project_state.py guard
]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-voice-window = "jarvis.multimodal.voice_window:main"

[project.optional-dependencies]
audio = [
    "pyaudio>=0.2.14",
]
voice = [
    "SpeechRecognition>=3.10,<4",
    "PyAudio>=0.2.14",
    "edge-tts>=6.1,<8",
    "pyttsx3>=2.90,<3",
    "faster-whisper>=1.1,<2",
    # faster-whisper 1.2.1 still calls a PyAV API removed in PyAV 19.
    "av>=11,<19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
